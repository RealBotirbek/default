<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Name</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #172b4d;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .name {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .role {
            font-size: 18px;
            color: #667085;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #172b4d;
            background: white;

            text-decoration: none;
            font-size: 20px;

            border: 1px solid #e2e5e9;

            transition: 0.2s ease;
        }

        .social-links a:hover {
            transform: translateY(-3px);
            border-color: #172b4d;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #98a2b3;
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Logo -->
        <img
            src="EdTrack.png"
            alt="Logo"
            class="logo"
        >

        <h1 class="name">Botirbek Abduxalimov</h1>

        <p class="role">Python Django Backend Developer</p>

        <div class="social-links">

            <!-- Telegram -->
            <a
                href="https://t.me/edtrack"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Telegram"
            >
                <i class="fa-brands fa-telegram"></i>
            </a>

            <!-- GitHub -->
            <a
                href="https://github.com/RealBotirbek"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
            >
                <i class="fa-brands fa-github"></i>
            </a>

            <!-- LinkedIn -->
            <a
                href="https://www.linkedin.com/in/realbotirbek/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
            >
                <i class="fa-brands fa-linkedin-in"></i>
            </a>

        </div>

        <p class="footer">
            © 2026 Botirbek Abduxalimov
        </p>

    </main>

</body>
</html>
